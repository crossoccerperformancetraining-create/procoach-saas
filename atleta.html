async function uploadAthleteVideo(programId){const input=document.querySelector(`.athlete-video-file[data-id="${programId}"]`),file=input?.files?.[0],statusEl=$('upload-'+programId);if(!file){notice('Escolha ou grave um vídeo.','warn');return}if(file.size>100*1024*1024){notice('Vídeo muito grande. Limite atual: 100 MB.','error');return}if(!storage||!auth?.currentUser){notice('Firebase Storage ainda não está disponível.','error');return}try{if(statusEl)statusEl.textContent='Enviando vídeo…';const safeName=String(file.name||'execucao.mp4').replace(/[^a-zA-Z0-9._-]+/g,'_'),path=`athleteUploads/${auth.currentUser.uid}/${token}/${Date.now()}_${safeName}`,ref=storage.ref(path),task=ref.put(file);task.on('state_changed',snap=>{if(statusEl)statusEl.textContent=`Enviando ${Math.round(snap.bytesTransferred/snap.totalBytes*100)}%`;});await task;const url=await ref.getDownloadURL(),note=document.querySelector(`.athlete-video-note[data-id="${programId}"]`)?.value||'',upload={id:'upload_'+Date.now(),programId,url,name:file.name,size:file.size,note,at:new Date().toISOString(),status:'Enviado'};const next={...responses(),uploads:[upload,...safe(responses().uploads)]};await patchResponses(next);if(statusEl)statusEl.textContent='Vídeo enviado ✓';if(input)input.value='';notice('Vídeo enviado para a comissão.','ok')}catch(e){if(statusEl)statusEl.textContent='Falha no envio.';notice('Não foi possível enviar o vídeo. Verifique o Firebase Storage.','error')}}
async function enableFcmPush(){if(!messaging){notice('FCM não é suportado neste navegador.','warn');return}if(!PROCOACH_VAPID_KEY){notice('FCM preparado. Falta configurar a chave VAPID no site.','warn');return}try{const permission=await Notification.requestPermission();if(permission!=='granted')return notice('Permissão de notificação não concedida.','warn');const reg=await navigator.serviceWorker.ready,fcmtoken=await messaging.getToken({vapidKey:PROCOACH_VAPID_KEY,serviceWorkerRegistration:reg});if(!fcmtoken)throw new Error('token');const next={...responses(),push:{token:fcmtoken,at:new Date().toISOString(),platform:navigator.userAgent}};await patchResponses(next);notice('Push em segundo plano ativado.','ok')}catch(e){notice('Não foi possível registrar o FCM Push.','error')}}

function activationView(error=false){return `<div class="card athlete-module-card" style="margin-top:18px"><div class="label">Ativar acesso</div><h3>${error?'Não foi possível abrir este perfil':'Conecte seu ProCoach Athlete'}</h3><div class="muted" style="line-height:1.5;margin-bottom:10px">No ProCoach da comissão, abra Portal do atleta, publique o perfil e copie o link individual. Cole abaixo o link completo ou somente o código.</div>${error?`<div class="notice error">${esc(errorReason||'Este código não está ativo. Peça à comissão para publicar ou atualizar o perfil.')}</div>`:''}<input class="field" id="activation-code" value="${error?esc(token):''}" placeholder="Cole o link individual ou código de acesso"><button class="primary" id="activate-access" style="width:100%;margin-top:10px">${error?'TENTAR NOVAMENTE':'ATIVAR MEU APP'}</button><button class="secondary" id="clear-access" style="width:100%;margin-top:8px">LIMPAR ACESSO SALVO</button></div>`}

function render(){const title=$('title'),sub=$('subtitle'),content=$('content');if(status==='loading'){content.innerHTML='<div class="empty">Validando o acesso com a comissão…</div>';return}if(status==='activation'||status==='error'){title.textContent='ProCoach Athlete';sub.textContent='Ative seu acesso individual';content.innerHTML=activationView(status==='error');$('nav').innerHTML='';bindActivation();return}title.textContent=data?.player?.name||'ProCoach Athlete';const teamParts=[data?.teamCategory&&data?.teamCategory!==data?.teamName?data.teamCategory:'',data?.teamName||'Equipe'].filter(Boolean);sub.textContent=teamParts.join(' · ')+' · '+(navigator.onLine?'online':'modo offline');const views={today:todayView,week:weekView,plan:planView,gym:gymView,messages:messagesView,psq:psqView,rpe:rpeView,video:videoView,docs:docsView};content.innerHTML=(views[tab]||todayView)();const nav=[['today','⌂','Hoje'],['week','▦','Semana'],['plan','◎','Plano'],['gym','◆','Academia'],['messages','✉','Mensagens'],['psq','♡','PSQ'],['rpe','◉','PSE'],['video','▶','Vídeos'],['docs','▤','Docs']];$('nav').innerHTML=nav.map(([id,ic,l])=>`<button data-tab="${id}" class="${tab===id?'active':''}"><span class="ico">${ic}</span>${l}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});bind()}

function accessError(error){const code=String(error?.code||'');if(!navigator.onLine)return'Sem conexão. Reconecte-se à internet ou abra um perfil já ativado neste aparelho.';if(code.includes('operation-not-allowed'))return'O acesso de atletas ainda não foi habilitado pela comissão.';if(code.includes('permission-denied'))return'O perfil existe, mas a permissão de acesso precisa ser liberada pela comissão.';if(code.includes('unavailable'))return'O servidor está temporariamente indisponível. Tente novamente em alguns instantes.';return'Não foi possível validar este código. Confirme se o perfil foi publicado novamente pela comissão.'}
