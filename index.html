        if (this.state.hasError) return (

const RadarChart = ({ data, size = 120, color = "#3b82f6" }) => {
    const scale = size / 2.5; const center = size / 2; const d = data || { r:0, g:0, p:0, a:0 };
    const pts = [d.r, d.g, d.p, d.a].map((val, i) => `${center + Math.cos((Math.PI / 2) * i - Math.PI / 2) * (val * scale)},${center + Math.sin((Math.PI / 2) * i - Math.PI / 2) * (val * scale)}`);
    return (<div className="relative flex items-center justify-center"><svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} className="overflow-visible"><circle cx={center} cy={center} r={scale} fill="none" stroke="#e2e8f0" strokeWidth="1" strokeDasharray="2,2"/><line x1={center} y1={center - scale} x2={center} y2={center + scale} stroke="#cbd5e1" strokeWidth="1" /><line x1={center - scale} y1={center} x2={center + scale} y2={center} stroke="#cbd5e1" strokeWidth="1" /><polygon points={pts.join(' ')} fill={color} fillOpacity="0.3" stroke={color} strokeWidth="2" /><text x={center} y={center - scale - 10} textAnchor="middle" fontSize="9" fontWeight="bold" fill="#64748b">NOTA</text><text x={center + scale + 10} y={center + 3} textAnchor="start" fontSize="9" fontWeight="bold" fill="#64748b">GOLS</text><text x={center} y={center + scale + 12} textAnchor="middle" fontSize="9" fontWeight="bold" fill="#64748b">PRES</text><text x={center - scale - 10} y={center + 3} textAnchor="end" fontSize="9" fontWeight="bold" fill="#64748b">AST</text></svg></div>);

const SettingsModal = ({ show, onClose, themeColor, setThemeColor, teamLogo, setTeamLogo, teamName, setTeamName }) => {

    const handleImport = (e) => { const file = e.target.files[0]; if (!file) return; const reader = new FileReader(); reader.onload = (ev) => { try { const data = JSON.parse(ev.target.result); Object.keys(data).forEach(k => localStorage.setItem(k, data[k])); alert("Restaurado!"); window.location.reload(); } catch (err) { alert("Erro ao ler backup."); } }; reader.readAsText(file); };
    return ( <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 backdrop-blur-sm no-print" onClick={onClose}><div className="bg-white rounded-2xl shadow-xl w-full max-w-sm overflow-hidden" onClick={e=>e.stopPropagation()}><div className="p-4 text-white flex justify-between items-center" style={{backgroundColor: themeColor}}><h3 className="font-bold flex items-center gap-2 text-sm"><Icon name="settings"/> CONFIGURAÇÕES</h3><button onClick={onClose}><Icon name="x"/></button></div><div className="p-6"><h4 className="font-bold text-slate-700 mb-3 text-sm uppercase">Identidade da Equipe</h4><input className="w-full border rounded p-2 text-xs mb-3 font-bold" placeholder="Nome da Equipe" value={teamName||''} onChange={e=>setTeamName(e.target.value)} /><input className="w-full border rounded p-2 text-xs mb-4" placeholder="URL do Escudo (Imagem)" value={teamLogo||''} onChange={e=>setTeamLogo(e.target.value)} /><h4 className="font-bold text-slate-700 mb-3 text-sm uppercase">Cor Principal</h4><div className="flex gap-3 justify-center flex-wrap mb-6">{themeColors.map(color => ( <div key={color} className={`color-picker-swatch ${themeColor === color ? 'active' : ''}`} style={{backgroundColor: color}} onClick={() => setThemeColor(color)}></div> ))}</div><div className="border-t pt-4 flex flex-col gap-2"><button onClick={handleExport} className="w-full bg-blue-50 text-blue-700 border-blue-200 border py-2 rounded text-xs font-bold flex items-center justify-center gap-2 hover:bg-blue-100 transition-colors"><Icon name="download"/> BAIXAR BACKUP</button><div className="relative"><input type="file" id="importFile" accept=".json" onChange={handleImport} className="hidden" /><label htmlFor="importFile" className="w-full bg-green-50 text-green-700 border-green-200 border py-2 rounded text-xs font-bold flex items-center justify-center gap-2 cursor-pointer hover:bg-green-100 transition-colors"><Icon name="upload"/> RESTAURAR BACKUP</label></div></div></div>< ={s.d} onChange={e=>updateStat(k,'d',e.target.value)}/></td><td className="p-1"><input type="number" className="w-10 text-center border rounded bg-red-50" value={s.l} onChange={e=>updateStat(k,'l',e.target.value)}/></td><td className="p-1"><input type="number" className="w-10 text-center border rounded" value={s.gf} onChange={e=>updateStat(k,'gf',e.target.value)}/></td><td className="p-1"><input type="number" className="w-10 text-center border rounded" value={s.ga} onChange={e=>updateStat(k,'ga',e.target.value)}/></td><td className={`p-1 font-bold ${sg>0?'text-green-600':sg<0?'text-red-600':''}`}>{sg}</td><td className="p-1 font-black">{calc(s.p,s.w,s.d)}%</td></tr> ) })}<tr className="bg-slate-50 font-black"><td className="p-3 text-left">TOTAL</td><td>{t.p}</td><td className="text-green-600">{t.w}</td><td>{t.d}</td><td className="text-red-600">{t.l}</td><td>{t.gf}</td><td>{t.ga}</td><td>{t.gf-t.ga}</td><td>{calc(t.p,t.w,t.d)}%</td></tr></tbody></table></div></div></div></div> );

const AnalysisModal = ({ show, onClose, themeColor, players, history, currentDate }) => {
    if (!show) return null; const sessionData = (history && history[currentDate]) || { ratings: {} }; const r = sessionData.ratings || {}; const sp = ensureArray(players);

const PerformanceView = ({ players, history, themeColor }) => {
    const [selectedIdx,setSelectedIdx]=useState(null); const [period,setPeriod]=useState('week'); const safe=ensureArray(players);
    const pd=useMemo(()=>{const now=new Date();now.setHours(0,0,0,0);const start=new Date(now);start.setDate(start.getDate()-((start.getDay()+6)%7));const end=new Date(start);end.setDate(end.getDate()+7);const stats=safe.map(()=>({sum:0,count:0,sessions:[]}));Object.entries(history||{}).forEach(([date,data])=>{const current=new Date(`${date}T12:00:00`);if(period==='week'&&(current<start||current>=end))return;Object.entries(data?.ratings||{}).forEach(([idx,value])=>{const rating=Number(value);if(stats[idx]&&rating>=0&&rating<=5){stats[idx].sum+=rating;stats[idx].count+=1;stats[idx].sessions.push({date,rating});}});});return safe.map((player,idx)=>{const stat=stats[idx];return {...player,idx,avg:stat.count?Number((stat.sum/stat.count).toFixed(1)):0,count:stat.count,sessions:stat.sessions.sort((a,b)=>new Date(a.date)-new Date(b.date))};}).sort((a,b)=>b.avg-a.avg||b.count-a.count||a.name.localeCompare(b.name));},[players,history,period]);

const OpponentHistoryView = ({ scoutingData,setScoutingData,scoutingHistory,matchHistory,sessionHistory,teamName }) => {

    useEffect(()=>{if(scoutingData?.opponent&&!teamQuery)setTeamQuery(scoutingData.opponent);},[scoutingData?.opponent]);

cord.opponentCoach||record.coach||'Não informado'}</div></div><div className="text-2xl font-black">{result}</div></div><div className="p-4"><div className="grid grid-cols-2 md:grid-cols-4 gap-2 mb-4"><div className="metric-card"><div className="report-section-title">Sessões na semana</div><b className="text-xl">{week.length}</b></div><div className="metric-card"><div className="report-section-title">Exercícios</div><b className="text-xl">{drills.length}</b></div><div className="metric-card col-span-2"><div className="report-section-title">Sistema adversário</div><b>{record.system||'Não informado'}</b></div></div>{week.length?<div className="space-y-3">{week.map(([date,session])=><div key={date} className="border rounded-xl p-3 bg-slate-50"><div className="flex justify-between gap-3"><b className="text-xs">{formatDateBR(date)}</b><span className="text-[10px] text-slate-400">{ensureArray(session.drills).reduce((sum,item)=>sum+(parseInt(item.time)||0),0)} min</span></div><div className="flex flex-wrap gap-1 mt-2">{ensureArray(session.drills).map((drill,i)=><span key={drill.id||i} className="status-chip bg-blue-50 text-blue-700">{drill.name||drill.method||'Exercício'}</span>)}</div></div>)}</div>:<div className="border-2 border-dashed rounded-xl p-6 text-center text-xs text-slate-400">Nenhuma sessão registrada na semana deste confronto.</div>}{(record.of||record.df||record.bp)&&<div className="grid grid-cols-1 md:grid-cols-3 gap-3 mt-4 text-xs"><div><div className="report-section-title">Ofensivo</div><p className="mt-1 text-slate-600">{record.of||'-'}</p></div><div><div className="report-section-title">Defensivo</div><p className="mt-1 text-slate-600">{record.df||'-'}</p></div><div><div className="report-section-title">Bolas paradas</div><p className="mt-1 text-slate-600">{record.bp||'-'}</p></div></div>}</div></article>})}{!records.length&&<div className="modern-card p-10 text-center text-slate-400"><Icon name="search" size={34} className="mx-auto"/><div className="fon     const [lR, setLR] = useState({}); const [t, setT] = useState(null); const [sA, setSA] = useState(false); const pSd = useRef(sessionDate);
    useEffect(() => { 
        if (pSd.current !== sessionDate) {
            if (history && history[sessionDate]) { setDrills(ensureArray(history[sessionDate].drills)); setLR(history[sessionDate].ratings || {}); } 
            else { setDrills([]); setLR({}); }
            pSd.current = sessionDate;
        } else { setLR((history && history[sessionDate] && history[sessionDate].ratings) ? history[sessionDate].ratings : {}); }
    }, [sessionDate]);
    const upD = (i, f, v) => { const n=[...ensureArray(drills)]; n[i][f]=v; setDrills(n); };
    const upI = (i) => { const u=prompt("Link Imagem:"); if(u!==null) upD(i,'image',u); };
    const upV = (i) => { const u=prompt("Link Vídeo:"); if(u!==null) upD(i,'video',u); };
    const sav = () => { try { const nH={...history, [sessionDate]:{drills:ensureArray(drills),ratings:lR,header}}; setHistory(nH); setT("Salvo!"); setTimeout(()=>setT(null), 3000); } catch(e){} };
    const sDr = ensureArray(drills); const sAv = Object.values(lR).length>0 ? (Object.values(lR).reduce((a,b)=>a+b,0)/Object.values(lR).length).toFixed(1) : 0;
    const totalMinutes = sDr.reduce((sum, drill) => sum + (parseInt(drill.time) || 0), 0);
    const mov = (i, d) => { const n=[...sDr]; if (d==='up'&&i>0) [n[i],n[i-1]]=[n[i-1],n[i]]; else if(d==='down'&&i<n.length-1) [n[i],n[i+1]]=[n[i+1],n[i]]; setDrills(n); };
    return (
        <div className="flex flex-col md:flex-row h-full bg-slate-50 overflow-hidden text-slate-800 animate-fade-in relative">
            {t && <div className="fixed top-20 left-1/2 -translate-x-1/2 bg-green-500 text-white px-6 py-3 rounded-full font-bold text-xs shadow-lg z-50 flex items-center gap-2 no-print"><Icon name="check"/> {t}</div>}
            <AnalysisModal show={sA} onClose={()=>setSA(false)} themeColor={themeColor} players={players} history={history} currentDate={sessionDate} />
            <div className="flex-1 overflow-y-auto p-4" id="print-area">
                <div className="text-white p-3 rounded-xl shadow mb-4 flex justify-between items-center no-print" style={{backgroundColor: themeColor}}>
                        <div className="flex items-center gap-2"><span className="text-xs font-bold opacity-70 uppercase">Data:</span><input type="date" value={sessionDate} onChange={e=>setSessionDate(e.target.value)} className="bg-white/20 border border-white/30 rounded px-2 py-1 font-bold text-sm"/></div>
                        <div className="flex gap-2"><button onClick={()=>window.print()} className="flex items-center gap-1 bg-white/20 px-3 py-1 rounded font-bold text-xs"><Icon name="pdf"/> PDF</button><button onClick={()=>setSA(true)} className="flex items-center gap-1 bg-yellow-400 text-slate-900 px-3 py-1 rounded font-bold text-xs"><Icon name="chart"/> TOP 5</button><button onClick={sav} className="flex items-center gap-1 bg-green-500 px-3 py-1 rounded font-bold text-xs"><Icon name="check"/> SALVAR</button></div>
                </div>
                <div className="mb-6 rounded-2xl shadow-xl text-white p-6 relative overflow-hidden print-card" style={{background: `linear-gradient(135deg, ${themeColor}, #0f172a)`}}>
                    <div className="flex items-center gap-6 relative z-10"><div className="w-20 h-20 bg-white/10 rounded-2xl flex items-center justify-center border border-white/20 overflow-hidden">{logo?<img src={logo} className="w-full h-full object-contain"/>:<Icon name="image" className="opacity-50"/>}</div><div className="flex-1"><h1 className="text-3xl font-black uppercase mb-1">{teamName || 'EQUIPE'}</h1><div className="grid grid-cols-2 md:grid-cols-4 gap-4 text-sm mt-4"><div className="relative border border-white/30 rounded px-2 py-1 flex flex-col"><label className="text-[10px] opacity-70">DATA</label><span className="font-bold">{formatDateBR(sessionDate)}</span></div><div className="relative border border-white/30 rounded px-2 py-1 flex flex-col"><label className="text-[10px] opacity-70">LOCAL</label><input className="bg-transparent font-bold outline-none placeholder-white/50 w-full" placeholder="Ex: CT" value={header.local||''} onChange={e=>setHeader({...header, local: e.target.value})}/></div><div className="relative border border-white/30 rounded px-2 py-1 flex flex-col"><label className="text-[10px] opacity-70">INÍCIO</label><input type="time" className="bg-transparent font-bold outline-none w-full" value={header.time||''} onChange={e=>setHeader({...header, time: e.target.value})}/></div><div className="relative border border-white/30 rounded px-2 py-1 flex flex-col"><label className="text-[10px] opacity-70">DURAÇÃO</label><input className="bg-transparent font-bold outline-none placeholder-white/50 w-full" placeholder="Ex: 90 min" value={header.dur||''} onChange={e=>setHeader({...header, dur: e.target.value})}/></div></div></div></div>

                <div className="space-y-6 pb-20">

                            <div className="bg-slate-50 border-b p-2 flex justify-between items-center"><div className="flex gap-2 items-center"><span className="text-white font-bold text-xs px-2 py-1 rounded w-10 text-center" style={{backgroundColor: themeColor}}>{idx+1}</span><input className="font-bold bg-transparent outline-none uppercase text-sm w-32 md:w-48" value={drill.name} onChange={e=>upD(idx,'name',e.target.value)}/>{drill.video && <a href={drill.video} target="_blank" className="text-[10px] font-bold text-red-600 bg-red-100 px-2 py-1 rounded shadow-sm flex items-center gap-1 hover:bg-red-200 no-print"><Icon name="play" size={10}/> VÍDEO</a>}</div><div className="flex gap-2 items-center"><select className="text-[10px] border rounded bg-white p-1 w-24" value={drill.method} onChange={e=>upD(idx,'method',e.target.value)}>{activityOptions.map(o=><option key={o} value={o}>{o}</option>)}</select><div className="relative flex items-center bg-white border rounded px-2"><Icon name="clock" size={12} className="text-slate-400 mr-1"/><input className="w-8 text-[10px] font-bold outline-none text-right" value={drill.time} onChange={e=>upD(idx,'time',e.target.value)}/></div><div className="flex gap-1 no-print"><button onClick={()=>mov(idx, 'up')} className="text-slate-400 hover:text-blue-500"><Icon name="chevronUp" size={14}/></button><button onClick={()=>mov(idx, 'down')} className="text-slate-400 hover:text-blue-500"><Icon name="chevronDown" size={14}/></button></div><button onClick={()=>setDrills(sDr.filter((_,i)=>i!==idx))} className="text-red-400 no-print ml-2"><Icon name="trash" size={14}/></button></div></div>
                            <div className="flex h-64"><div className="w-1/2 bg-slate-100 flex items-center justify-center relative group/img">{drill.image ? <img src={drill.image} className="w-full h-full object-contain" /> : <div className="text-slate-400 flex flex-col items-center"><Icon name="image" size={32}/><span>Sem Imagem</span></div>}<div className="absolute inset-0 bg-black/60 flex flex-col gap-2 items-center justify-center opacity-0 group-hover/img:opacity-100 no-print"><button onClick={()=>upI(idx)} className="text-white hover:text-blue-400 bg-white/10 px-3 py-1 rounded-full flex items-center gap-1 border border-white/20"><Icon name="link" size={16}/> <span className="text-[10px] font-bold">IMAGEM</span></button><button onClick={()=>upV(idx)} className="text-white hover:text-red-400 bg-white/10 px-3 py-1 rounded-full flex items-center gap-1 border border-white/20"><Icon name="play" size={16}/> <span className="text-[10px] font-bold">VÍDEO</span></button></div></div><div className="w-1/2 p-3 flex flex-col gap-2"><textarea className="w-full h-1/2 bg-slate-50 border rounded p-2 text-xs resize-none" value={drill.desc} onChange={e=>upD(idx,'desc',e.target.value)} placeholder="Descrição..."/><textarea className="w-full h-1/2 bg-slate-50 border rounded p-2 text-xs resize-none" value={drill.variants} onChange={e=>upD(idx,'variants',e.target.value)} placeholder="Variações..."/></div></div>

                    <button onClick={()=>{setDrills([...sDr, { id: Date.now(), name: 'NOVO', method: 'Tático', dim: '-', time: '10', desc: '', variants: '', image: null, video: null }])}} className="w-full py-4 border-2 border-dashed border-slate-300 rounded-xl text-slate-400 hover:border-blue-500 font-bold flex items-center justify-center gap-2 no-print"><Icon name="plus"/> ADICIONAR EXERCÍCIO</button>

                </div>
                <div className="pdf-footer pdf-only"><span>{teamName || 'PROCOACH'} - Ficha de Treino</span><span>{formatDateBR(sessionDate)} | {sDr.length} exercícios | {totalMinutes} min</span></div>
            </div>
            <div className="w-full md:w-80 border-t md:border-t-0 md:border-l border-slate-200 bg-white flex flex-col h-64 md:h-full shadow-lg z-20 no-print"><div className="p-4 border-b border-slate-200 bg-slate-50 flex justify-between items-center"><div><div className="text-xs font-bold text-slate-400 uppercase">Nota Média</div><div className="text-2xl font-black flex items-center gap-1" style={{color: themeColor}}>{sAv} <Icon name="star" size={18} className="text-yellow-400"/></div></div><div className="text-xs font-bold text-right text-slate-400">JOGADORES<br/>DISPONÍVEIS</div></div><div className="flex-1 overflow-y-auto p-2 space-y-2 bg-slate-100">{ensureArray(players).filter(p=>!p.injured).map((p,i)=>(<div key={i} className="flex flex-col p-2 rounded border bg-white shadow-sm"><div className="flex items-center gap-2 mb-1"><div className="w-6 h-6 rounded-full bg-slate-200 overflow-hidden relative shrink-0">{p.image?<img src={p.image} className="w-full h-full object-cover"/>:<Icon name="users" size={10}/>}</div><div className="flex-1 min-w-0 font-bold text-xs text-slate-700 uppercase truncate">{p.name}</div><input type="checkbox" className="ml-auto w-4 h-4 cursor-pointer accent-green-600" defaultChecked={true}/></div><div className="flex justify-center"><StarRating value={lR[i]||0} onChange={v=>setLR({...lR, [i]:v})}/></div></div>))}</div></div>
        </div>

};

const QRCodeBox = ({ value, size=76 }) => {
    const ref = useRef(null);
    useEffect(() => {
        if (!ref.current) return;
        ref.current.innerHTML = '';
        if (value && window.QRCode) new window.QRCode(ref.current, { text:value, width:size, height:size, colorDark:'#0f172a', colorLight:'#ffffff', correctLevel:window.QRCode.CorrectLevel.M });
    }, [value, size]);
    if (!value) return null;
    return <div className="flex flex-col items-center gap-1"><div ref={ref} className="bg-white p-1 rounded border"></div><span className="text-[8px] font-bold text-slate-400 uppercase">Vídeo</span></div>;
};

const SignaturePad = ({ value, onChange, label='Assinatura do treinador' }) => {
    const canvasRef = useRef(null); const drawing = useRef(false);
    useEffect(() => { const c=canvasRef.current; if(!c||!value)return; const img=new Image(); img.onload=()=>{const x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);}; img.src=value; }, []);
    const point = (e) => { const c=canvasRef.current, r=c.getBoundingClientRect(), p=e.touches?e.touches[0]:e; return {x:(p.clientX-r.left)*(c.width/r.width),y:(p.clientY-r.top)*(c.height/r.height)}; };
    const start = (e) => { drawing.current=true; const p=point(e),x=canvasRef.current.getContext('2d');x.beginPath();x.moveTo(p.x,p.y);e.preventDefault(); };
    const move = (e) => { if(!drawing.current)return; const p=point(e),x=canvasRef.current.getContext('2d');x.lineWidth=2.2;x.lineCap='round';x.strokeStyle='#0f172a';x.lineTo(p.x,p.y);x.stroke();e.preventDefault(); };
    const end = () => { if(!drawing.current)return;drawing.current=false;onChange(canvasRef.current.toDataURL('image/png')); };
    const clear = () => { const c=canvasRef.current;c.getContext('2d').clearRect(0,0,c.width,c.height);onChange(''); };
    return <div><div className="flex justify-between items-center mb-1"><label className="report-section-title">{label}</label><button onClick={clear} className="text-[10px] font-bold text-red-500 no-print">Limpar</button></div><canvas ref={canvasRef} width="520" height="130" onMouseDown={start} onMouseMove={move} onMouseUp={end} onMouseLeave={end} onTouchStart={start} onTouchMove={move} onTouchEnd={end} className="w-full h-28 bg-white border border-dashed border-slate-300 rounded-xl touch-none"></canvas></div>;
};

const ModernLineupView = ({ players, history, themeColor }) => {
    const [formations,setFormations]=useSafeStorage('pc_saved_formations_v3',[]); const [system,setSystem]=useState('4-3-3'); const [lineup,setLineup]=useState({}); const [slot,setSlot]=useState(null); const [name,setName]=useState('Formação principal');
    const safe=ensureArray(players); const slots=FORMATION_SLOTS[system]||FORMATION_SLOTS['4-3-3'];
    const weekly=useMemo(()=>{const start=new Date();start.setHours(0,0,0,0);start.setDate(start.getDate()-((start.getDay()+6)%7));const end=new Date(start);end.setDate(end.getDate()+7);const stats=safe.map(()=>({sum:0,count:0,avg:0}));Object.entries(history||{}).forEach(([date,data])=>{const current=new Date(`${date}T12:00:00`);if(current<start||current>=end)return;Object.entries(data?.ratings||{}).forEach(([idx,value])=>{const n=Number(value);if(stats[idx]&&n>=0&&n<=5){stats[idx].sum+=n;stats[idx].count+=1;}});});return stats.map(s=>({...s,avg:s.count?Number((s.sum/s.count).toFixed(1)):0}));},[players,history]);
    const ranked=safe.map((p,i)=>({...p,_index:i,weekly:weekly[i]||{avg:0,count:0}})).sort((a,b)=>b.weekly.avg-a.weekly.avg||b.weekly.count-a.weekly.count||a.name.localeCompare(b.name));
    const leader=ranked.find(p=>p.weekly.count>0);
    const save=()=>{const item={id:Date.now(),name:name||system,system,lineup};setFormations([item,...ensureArray(formations).filter(f=>f.name!==item.name)]);};
    const load=(id)=>{const f=ensureArray(formations).find(x=>String(x.id)===String(id));if(f){setName(f.name);setSystem(f.system);setLineup(f.lineup||{});setSlot(null);}};
    return <div className="h-full overflow-y-auto bg-slate-50 p-4 md:p-6">
        <div className="modern-card p-4 mb-4 no-print flex flex-wrap gap-3 items-end">
            <div className="flex-1 min-w-48"><label className="report-section-title block mb-1">Nome da formação</label><input className="modern-input" value={name} onChange={e=>setName(e.target.value)}/></div>
            <div><label className="report-section-title block mb-1">Sistema</label><select className="modern-input min-w-36" value={system} onChange={e=>{setSystem(e.target.value);setLineup({});}}>{Object.keys(FORMATION_SLOTS).map(s=><option key={s}>{s}</option>)}</select></div>
            <button className="btn-primary" onClick={save}><Icon name="save"/> Salvar formação</button>
            <select className="modern-input min-w-48" defaultValue="" onChange={e=>load(e.target.value)}><option value="">Abrir formação salva...</option>{ensureArray(formations).map(f=><option key={f.id} value={f.id}>{f.name} - {f.system}</option>)}</select>
        </div>

const ModernSessionView = ({ drills,setDrills,header,setHeader,logo,themeColor,players,history,setHistory,sessionDate,setSessionDate,teamName,syncMicrocycle }) => {
    const record=(history&&history[sessionDate])||{}; const [attendance,setAttendance]=useState(record.attendance||{}); const [rpe,setRpe]=useState(record.rpe||{}); const [ratings,setRatings]=useState(record.ratings||{}); const [actual,setActual]=useState(record.actualDuration||''); const [review,setReview]=useState(record.review||{rating:0,outcomes:'',improvements:'',incidents:''}); const [signature,setSignature]=useState(record.signature||''); const [section,setSection]=useState('plan');
    useEffect(()=>{const r=(history&&history[sessionDate])||{};setDrills(ensureArray(r.drills));setAttendance(r.attendance||{});setRpe(r.rpe||{});setRatings(r.ratings||{});setActual(r.actualDuration||'');setReview(r.review||{rating:0,outcomes:'',improvements:'',incidents:''});setSignature(r.signature||'');},[sessionDate]);
    const safe=ensureArray(players), ds=ensureArray(drills), planned=ds.reduce((a,d)=>a+(parseInt(d.time)||0),0); const scheduledDates=Object.entries(history||{}).filter(([,value])=>ensureArray(value?.drills).length).map(([date,value])=>({date,count:ensureArray(value.drills).length})).sort((a,b)=>b.date.localeCompare(a.date)); const present=safe.filter((_,i)=>(attendance[i]||'Presente')==='Presente').length; const totalLoad=safe.reduce((a,_,i)=>a+((parseInt(rpe[i])||0)*(parseInt(actual)||planned||0)),0); const avgRpe=safe.length?(safe.reduce((a,_,i)=>a+(parseInt(rpe[i])||0),0)/safe.length).toFixed(1):0; const ratedValues=Object.values(ratings).map(Number).filter(v=>v>=0&&v<=5); const athleteRatingAvg=ratedValues.length?(ratedValues.reduce((a,b)=>a+b,0)/ratedValues.length).toFixed(1):'0.0';
    const weeklyRatings=useMemo(()=>{const start=new Date(`${sessionDate}T12:00:00`);start.setDate(start.getDate()-((start.getDay()+6)%7));start.setHours(0,0,0,0);const end=new Date(start);end.setDate(end.getDate()+7);const stats=safe.map(()=>({sum:0,count:0,avg:0}));Object.entries(history||{}).forEach(([date,data])=>{if(date===sessionDate)return;const current=new Date(`${date}T12:00:00`);if(current<start||current>=end)return;Object.entries(data?.ratings||{}).forEach(([idx,value])=>{const n=Number(value);if(stats[idx]&&n>=0&&n<=5){stats[idx].sum+=n;stats[idx].count+=1;}});});Object.entries(ratings||{}).forEach(([idx,value])=>{const n=Number(value);if(stats[idx]&&n>=0&&n<=5){stats[idx].sum+=n;stats[idx].count+=1;}});return stats.map(s=>({...s,avg:s.count?Number((s.sum/s.count).toFixed(1)):0}));},[players,history,ratings,sessionDate]);
    const applyDrills=(next)=>{setDrills(next);if(syncMicrocycle)syncMicrocycle(next);};

    const save=()=>{setHistory({...history,[sessionDate]:{...record,drills:ds,header,attendance,rpe,ratings,actualDuration:actual,review,signature,updatedAt:new Date().toISOString()}});if(syncMicrocycle)syncMicrocycle(ds);};
    return <div className="h-full overflow-y-auto bg-slate-50 p-4 md:p-6">

a className="modern-input h-24 text-sm" placeholder="Variações e correções do treinador" value={d.variants||''} onChange={e=>updateDrill(i,'variants',e.target.value)}/><div className="grid grid-cols-[1fr_110px] gap-2"><input className="modern-input !min-h-10 text-xs" placeholder="URL do vídeo" value={d.video||''} onChange={e=>updateDrill(i,'video',e.target.value)}/><input className="modern-input !min-h-10 text-xs" placeholder="Séries" value={d.series||''} onChange={e=>updateDrill(i,'series',e.target.value)}/></div></div></div></div>)}</div><aside className="modern-card p-4 h-fit xl:sticky xl:top-0"><div className="flex justify-between items-center mb-3"><div><div className="report-section-title">Atletas da sessão</div><h3 className="font-black">Nota individual</h3></div><div className="text-right"><div className="text-2xl font-black text-amber-500">{athleteRatingAvg}</div><div className="text-[8px] text-slate-400 font-bold">MÉDIA</div></div></div><p className="text-[10px] text-slate-500 mb-3">Clique de 0 a 5 estrelas. A nota é salva na sessão e entra no desempenho semanal.</p><div className="space-y-2 max-h-[560px] overflow-y-auto pr-1">{safe.map((p,i)=><div key={i} className="border rounded-xl p-2 bg-slate-50"><div className="flex items-center gap-2 mb-2"><div className="w-8 h-8 rounded-full bg-white border overflow-hidden flex items-center justify-center">{p.image?<img src={p.image} className="w-full h-full object-cover"/>:<Icon name="users" size={14}/>}</div><div className="min-w-0 flex-1"><div className="text-xs font-black truncate">{p.name}</div><div className="text-[9px] text-slate-400 font-bold">{attendance[i]||'Presente'} · {Object.prototype.hasOwnProperty.call(ratings,i)?`${ratings[i]}/5`:'Sem nota'}</div></div></div><StarRating value={ratings[i]??0} onChange={value=>updateRating(i,value)} showZero size={18}/></div>)}</div></aside></div>

            const current=new Date(`${date}T12:00:00`); if(Number.isNaN(current.getTime())||current<cutoff)return;
            const duration=parseInt(data?.actualDuration)||ensureArray(data?.drills).reduce((total,drill)=>total+(parseInt(drill.time)||0),0);
            safe.forEach((_,index)=>{
                if(!stats[index])return; stats[index].sessions+=1;

                stats[index].load+=(parseInt(data?.rpe?.[index])||0)*duration;
                const rating=Number(data?.ratings?.[index]); if(rating>=0&&rating<=5){stats[index].sum+=rating;stats[index].count+=1;}
            });
        });
        return stats.map(stat=>({...stat,avg:stat.count?Number((stat.sum/stat.count).toFixed(1)):0,presence:stat.sessions?Math.round(stat.present/stat.sessions*100):0}));
    },[players,sessionHistory]);

    const snapshot=()=>({items:JSON.parse(JSON.stringify(items)),arrows:JSON.parse(JSON.stringify(arrows))});
    const commit=(nextItems=items,nextArrows=arrows)=>{setPast(previous=>[...previous,snapshot()].slice(-40));setFuture([]);setItems(nextItems);setArrows(nextArrows);};
    const undo=()=>{if(!past.length)return;const previous=past[past.length-1];setFuture(current=>[snapshot(),...current]);setItems(previous.items);setArrows(previous.arrows);setPast(past.slice(0,-1));};
    const redo=()=>{if(!future.length)return;const next=future[0];setPast(current=>[...current,snapshot()].slice(-40));setItems(next.items);setArrows(next.arrows);setFuture(future.slice(1));};
    const point=(event)=>{const rect=svgRef.current.getBoundingClientRect();return{x:Math.max(1.5,Math.min(103.5,(event.clientX-rect.left)/rect.width*105)),y:Math.max(1.5,Math.min(66.5,(event.clientY-rect.top)/rect.height*68))};};

        lines.forEach((count,lineIndex)=>{const x=minimum+(step*lineIndex);for(let index=0;index<count;index++){positions.push({x,y:(index+1)*68/(count+1),role:lineIndex===0?'DEF':lineIndex===lines.length-1?'ATA':'MEI'});}});

    const orderedPlayerIndexes=()=>safe.map((player,index)=>({player,index})).sort((a,b)=>{

    const selectedFormation=ensureArray(savedFormations).find(formation=>String(formation.id)===String(formationId));

        const formation=selectedFormation||ensureArray(savedFormations).find(entry=>entry.system===system);

        const unique=[...new Set(stored)]; orderedPlayerIndexes().forEach(index=>{if(!unique.includes(index))unique.push(index);}); return unique.slice(0,11);
    };
    const loadOurTeam=()=>{

    const move=(event)=>{if(!drag)return;const position=point(event);setItems(current=>current.map(item=>item.id===drag?{...item,...position}:item));};

    const applySituation=()=>{

    const frameData=(frameName,index)=>({id:frames[index]?.id||`frame-${Date.now()}-${index}`,name:frameName||`Quadro ${index+1}`,items:JSON.parse(JSON.stringify(items)),arrows:JSON.parse(JSON.stringify(arrows)),note});
    const saveFrame=()=>{if(!frames.length){setFrames([frameData('Quadro 1',0)]);setActiveFrame(0);return;}setFrames(frames.map((frame,index)=>index===activeFrame?frameData(frame.name,index):frame));};

        const storedFrames=frames.length?frames.map((frame,index)=>index===activeFrame?frameData(frame.name,index):frame):[frameData('Quadro 1',0)];

    const exportPng=()=>{

.id} className="pc-gym-exercise border-t mt-3 pt-3 flex gap-3"><div className="w-24 h-20 rounded-xl bg-slate-100 overflow-hidden flex items-center justify-center">{e.gifUrl?<img src={e.gifUrl} className="w-full h-full object-contain"/>:<Icon name="dumbbell"/>}</div><div className="flex-1"><b className="text-sm">{e.name}</b><div className="text-[10px] text-slate-500">{e.sets} x {e.reps} · {e.load||'carga livre'} · descanso {e.rest}</div></div></div>)}<button className="btn-primary w-full mt-3" onClick={()=>publishItemRecipients(p)}>Enviar programa para {recipientIndexesForItem(p,safe,athleteGroups).length} Athlete(s)</button></div>)}{!targetGyms.length&&<div className="modern-card p-8 text-center text-xs text-slate-400">Nenhum programa de academia.</div>}</div></div>}

// ===== PROCOACH V6.4 — SMART PERFORMANCE & WORKFLOW =====
const smart64Readiness = (w) => { if(!w)return null; if(Number.isFinite(Number(w.readiness)))return Math.max(0,Math.min(100,Math.round(Number(w.readiness)))); const vals=['sleep','fatigue','pain','stress','mood'].map(k=>Number(w?.[k])).filter(v=>Number.isFinite(v)); return vals.length?Math.max(0,Math.min(100,Math.round(100-(vals.reduce((a,b)=>a+b,0)/vals.length)*20))):null; };
const smart64Stamp = item => { const date=item?.deadline||item?.due||item?.date||''; if(!date)return null; const time=item?.deadlineTime||item?.time||'23:59'; const d=new Date(`${date}T${time||'23:59'}:00`); return Number.isNaN(d.getTime())?null:d; };
const smart64Target = (item,index,players,groups) => { try{return itemTargetsAthlete(item,index,players,groups)}catch(e){ const target=String(item?.target||'Equipe'); if(target==='Equipe')return true; if(Number(item?.player)===index)return true; const ref=athleteRefId(players[index]||{},index); return ensureArray(item?.athleteIds).includes(ref)||ensureArray(item?.athleteIds).includes(index); } };
const smart64Status = (item,index) => String(item?.responses?.[index]?.status||item?.responses?.[String(index)]?.status||'Enviado');
const smart64TerminalTask = s => ['Concluído','Entendido','Respondido'].includes(String(s||''));
const smart64TerminalMedia = s => ['Entendido','Respondido','Concluído'].includes(String(s||''));
const smart64WeekStart = (offset=0) => { const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7)+(offset*7));return d; };
const smart64WeekMetrics = (index,history,matches,offset=0,player={}) => { const start=smart64WeekStart(offset),end=new Date(start);end.setDate(end.getDate()+7);let sessions=0,minutes=0,load=0,present=0,attendance=0,ratingSum=0,ratingCount=0;Object.entries(history||{}).forEach(([date,r])=>{const d=new Date(`${date}T12:00:00`);if(d<start||d>=end)return;let touched=false;if(Object.prototype.hasOwnProperty.call(r?.ratings||{},index)){const v=Number(r.ratings[index]);if(Number.isFinite(v)){ratingSum+=v;ratingCount++;touched=true}}if(Object.prototype.hasOwnProperty.call(r?.attendance||{},index)){attendance++;if(r.attendance[index]==='Presente')present++;touched=true}if(Object.prototype.hasOwnProperty.call(r?.rpe||{},index)){const rp=Number(r.rpe[index])||0,dur=Number(r.actualDuration)||ensureArray(r.drills).reduce((sum,x)=>sum+(parseInt(x.time)||0),0);minutes+=dur;load+=rp*dur;touched=true}if(touched)sessions++;});let matchMinutes=0;ensureArray(matches).forEach(m=>{const d=new Date(`${m.date||''}T12:00:00`);if(Number.isNaN(d.getTime())||d<start||d>=end)return;const ref=athleteRefId(player,index);matchMinutes+=Number(m.playerMinutes?.[ref]??m.playerMinutes?.[index]??0)||0;});return{sessions,minutes,load,matchMinutes,attendance:attendance?Math.round(present/attendance*100):null,rating:ratingCount?ratingSum/ratingCount:null}; };
const smart64DevelopmentScore = ({index,players,history,plans,tasks,media,wellness,groups}) => { const components=[];const pPlans=ensureArray(plans).filter(x=>Number(x.player)===index);if(pPlans.length){const v=pPlans.reduce((sum,x)=>sum+Math.max(0,Math.min(100,Number(x.progress)||0)),0)/pPlans.length;components.push({label:'Plano',value:v,weight:35});}const pTasks=ensureArray(tasks).filter(x=>smart64Target(x,index,players,groups));if(pTasks.length){const done=pTasks.filter(x=>smart64TerminalTask(smart64Status(x,index))).length;components.push({label:'Atividades',value:done/pTasks.length*100,weight:25});}const pMedia=ensureArray(media).filter(x=>smart64Target(x,index,players,groups));if(pMedia.length){const done=pMedia.filter(x=>smart64TerminalMedia(smart64Status(x,index))||smart64Status(x,index)==='Visto').length;components.push({label:'Mídia',value:done/pMedia.length*100,weight:15});}const cutoff=new Date();cutoff.setDate(cutoff.getDate()-6);cutoff.setHours(0,0,0,0);const psqDays=new Set(ensureArray(wellness).filter(x=>Number(x.player)===index&&x.date&&new Date(`${x.date}T12:00:00`)>=cutoff).map(x=>x.date)).size;if(psqDays)components.push({label:'PSQ',value:Math.min(100,psqDays/7*100),weight:15});let attN=0,attP=0;Object.values(history||{}).forEach(r=>{if(Object.prototype.hasOwnProperty.call(r?.attendance||{},index)){attN++;if(r.attendance[index]==='Presente')attP++;}});if(attN)components.push({label:'Presença',value:attP/attN*100,weight:10});if(!components.length)return{score:null,components:[]};const weight=components.reduce((a,c)=>a+c.weight,0),score=Math.round(components.reduce((a,c)=>a+c.value*c.weight,0)/weight);return{score,components}; };

const SmartLibraryView = ({ lib,setLib,onAddS,onSchedule,tC,sessionHistory,scoutingHistory,matchHistory }) => {

    const [galleryDrafts,setGalleryDrafts]=useState({});

    const [saveStatus,setSaveStatus]=useState({});
    const [bulkImageTarget,setBulkImageTarget]=useState('');
    const [bulkImageUrls,setBulkImageUrls]=useState('');

    const normalizeImages=(item)=>ensureArray(item?.images).map((entry,index)=>typeof entry==='string'?{id:`legacy-${index}`,type:'Referência',url:entry}:entry).filter(entry=>entry&&entry.url);
    const coverOf=(item)=>item?.image||item?.imageUrl||normalizeImages(item)[0]?.url||'';
    const patchItem=(id,updater)=>setLib(current=>ensureArray(current).map(item=>item.libId===id?(typeof updater==='function'?updater(item):{...item,...updater}):item));
    const update=(id,f,v)=>patchItem(id,item=>({...item,[f]:v}));

    const addToSession=(item)=>{onAddS(item);setAdded(item.libId);setTimeout(()=>setAdded(null),1800);};
    const usedAgainst=item=>{const matches=[...ensureArray(scoutingHistory),...ensureArray(matchHistory)].filter(record=>record.date&&record.opponent).sort((a,b)=>String(a.date).localeCompare(String(b.date)));const names=[];Object.entries(sessionHistory||{}).forEach(([date,record])=>{const used=ensureArray(record.drills).some(drill=>(item.libId&&drill.libId===item.libId)||drill.name===item.name);if(!used)return;const sessionDate=new Date(`${date}T12:00:00`);const match=matches.find(candidate=>{const target=new Date(`${candidate.date}T12:00:00`);const diff=(target-sessionDate)/86400000;return diff>=0&&diff<=7;});if(match&&!names.includes(match.opponent))names.push(match.opponent);});return names;};

    const addImage=(id,url,type='Referência')=>{const clean=String(url||'').trim();if(!clean)return;patchItem(id,item=>{const gallery=normalizeImages(item);const exists=gallery.some(entry=>entry.url===clean);const next=exists?gallery:[...gallery,{id:`img-${Date.now()}-${Math.random().toString(36).slice(2,7)}`,type,url:clean,createdAt:new Date().toISOString()}];return {...item,image:item.image||clean,imageUrl:item.imageUrl||clean,images:next};});};
    const removeImage=(id,imageId)=>patchItem(id,item=>{const gallery=normalizeImages(item);const removed=gallery.find(entry=>entry.id===imageId);const next=gallery.filter(entry=>entry.id!==imageId);const currentCover=coverOf(item);const nextCover=removed&&removed.url===currentCover?(next[0]?.url||''):currentCover;return {...item,image:nextCover,imageUrl:nextCover,images:next};});

    const makeSequence=()=>({id:`seq_${Date.now()}`,name:'Nova sequência',category:'Mobilidade',type:'Academia',estimatedMinutes:'12',note:'',favorite:false,exercises:[],createdAt:new Date().toISOString()});

    const syncProgress=async()=>{if(!db||!auth?.currentUser)return setStatus('Entre na conta da comissão para sincronizar.');setStatus('Sincronizando progresso…');const next={...routineProgress};try{for(const [idxRaw,token] of Object.entries(portalTokens||{})){if(!token)continue;const idx=Number(idxRaw),snap=await db.collection('athletePortal').doc(token).get();if(!snap.exists)continue;const rr=snap.data()?.responses?.routine||{};Object.entries(rr).forEach(([sessionId,response])=>{next[sessionId]={...(next[sessionId]||{}),[idx]:response}})}setRoutineProgress(next);setStatus('Progresso das rotinas sincronizado ✓');}catch(e){setStatus('Não foi possível sincronizar o progresso agora.')}};
    const deliveryStats=delivery=>{const recipients=ensureArray(delivery.recipientIndexes),sessions=ensureArray(delivery.sessionIds);let total=recipients.length*sessions.length,done=0,started=0;recipients.forEach(idx=>sessions.forEach(id=>{const r=routineProgress?.[id]?.[idx];if(r?.status==='Concluído')done++;else if(r?.status)started++;}));return{total,done,started,pct:total?Math.round(done/total*100):0}};

ton className="btn-secondary !min-h-8 !px-2" onClick={()=>moveExercise(index,-1)}>↑</button><button className="btn-secondary !min-h-8 !px-2" onClick={()=>moveExercise(index,1)}>↓</button><button className="btn-secondary !min-h-8 !px-2 !text-red-400" onClick={()=>deleteExercise(index)}>×</button></div></div>)}{!ensureArray(selected.exercises).length&&<div className="text-xs text-slate-400 text-center py-8">Adicione exercícios da Biblioteca acima.</div>}</div>

electedWeek.id,{note:e.target.value})}/></div></div></div><div className="modern-card p-5"><div className="report-section-title mb-3">Sequência por dia</div><div className="pc-v65-week-grid">{days.map(([label,offset])=>{const sid=selectedWeek.days?.[label]||'',seq=ensureArray(sequences).find(x=>String(x.id)===String(sid));return <div key={label} className="pc-v65-day"><b>{label}</b><small>{formatDateBR(addDays(selectedWeek.startDate||mondayOf(today),offset))}</small><select className="modern-input text-xs mt-3" value={sid} onChange={e=>patchWeek(selectedWeek.id,w=>({...w,days:{...(w.days||{}),[label]:e.target.value}}))}><option value="">Folga / sem rotina</option>{ensureArray(sequences).map(sq=><option key={sq.id} value={sq.id}>{sq.name}</option>)}</select>{seq&&<div className="mt-3 text-[9px] text-slate-400">{seq.category}<br/>{ensureArray(seq.exercises).length} exercícios · {seq.estimatedMinutes||'-'} min</div>}</div>})}</div></div><div className="modern-card p-5"><div className="grid grid-cols-1 lg:grid-cols-[minmax(0,1fr)_auto_auto] gap-3 items-end"><AthleteRecipientPicker players={safePlayers} groups={groups} value={recipient} onChange={setRecipient}/><button className="btn-secondary" onClick={addWeekToCalendar}><Icon name="calendar"/> ADICIONAR À SEMANA</button><button className="btn-primary" onClick={sendWeek}><Icon name="play"/> ENVIAR ROTINA</button></div><div className="text-[9px] text-slate-400 mt-3">O Athlete recebe cada sequência no dia correspondente e abre o modo Play exercício por exercício.</div></div></div>:<div className="modern-card p-10 text-center text-slate-400">Crie uma rotina semanal.</div>}</main></div>}

const InstallAppButton = () => {
    const [prompt,setPrompt]=useState(null); const [installed,setInstalled]=useState(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches);
    useEffect(()=>{const ready=e=>{e.preventDefault();setPrompt(e);};const done=()=>{setInstalled(true);setPrompt(null);};window.addEventListener('beforeinstallprompt',ready);window.addEventListener('appinstalled',done);return()=>{window.removeEventListener('beforeinstallprompt',ready);window.removeEventListener('appinstalled',done);};},[]);
    if(installed||!prompt)return null;
    return <button className="hidden lg:flex p-2.5 rounded-xl bg-blue-50 text-blue-600 no-print items-center gap-2 text-xs font-bold" onClick={async()=>{await prompt.prompt();const r=await prompt.userChoice;if(r.outcome==='accepted')setPrompt(null);}} title="Instalar ProCoach"><Icon name="download" size={17}/> Instalar</button>;
};

const buildInitialTeamRegistry = () => {
    let mainName='MINHA EQUIPE';
    try { const raw=window.localStorage.getItem('pc_team_name'); if(raw){ const parsed=JSON.parse(raw); if(parsed) mainName=parsed; } } catch(e) {}
    return {version:1,teams:[{id:'team-main',name:mainName,category:'Equipe Principal',season:String(new Date().getFullYear()),isMain:true,archived:false,createdAt:new Date().toISOString()}]};
};
const normalizeTeamRegistry = value => {
    const fallback=buildInitialTeamRegistry();
    const teams=ensureArray(value?.teams).filter(t=>t&&t.id);
    if(!teams.some(t=>t.id==='team-main')) teams.unshift(fallback.teams[0]);
    return {...fallback,...(value||{}),version:1,teams};
};
const teamDisplayLabel = team => team?.isMain ? 'Equipe Principal' : (team?.category||team?.name||'Equipe');
const teamStorageRaw = (teamId,key) => { try { return window.localStorage.getItem(getScopedStorageKey(key,teamId)); } catch(e){ return null; } };
const putTeamStorageRaw = (teamId,key,raw) => { try { if(raw!==null&&raw!==undefined) window.localStorage.setItem(getScopedStorageKey(key,teamId),raw); } catch(e){} };

                            <button onClick={()=>openGroup(group)} className={`main-nav-button w-full px-3 flex items-center gap-3 text-left ${activeGroup.id===group.id?'active text-white':'text-slate-400'}`}>
                                <span style={{color:activeGroup.id===group.id?themeColor:''}}><Icon name={group.icon}/></span><span className="font-bold text-sm">{group.label}</span>
                            </button>
                            {activeGroup.id===group.id && group.items.length>1 && <div className="ml-5 pl-4 border-l border-white/10 py-1 space-y-0.5">{group.items.map(item => <button key={item.tab} onClick={()=>setTab(item.tab)} className={`sub-nav-button w-full px-3 flex items-center gap-2 text-left text-xs ${tab===item.tab?'bg-white/10 text-white font-bold':'text-slate-400'}`}><Icon name={item.icon} size={14}/>{item.label}</button>)}</div>}
                        </div>)}
                    </nav>
                    <div className="p-3 border-t border-white/10 text-[10px] text-slate-500">Gestão esportiva profissional</div>
                </aside>
                <main className="flex-1 min-w-0 flex flex-col">
                    <header className="content-toolbar px-3 md:px-4 flex justify-between items-center z-20 shrink-0 transition-colors gap-3">
                        <div className="hidden md:flex min-w-0 items-center gap-3 flex-1"><div className="min-w-0 w-44"><div className="text-[8px] font-black text-sky-400 uppercase tracking-[.18em]">{activeGroup.label}</div><h1 className="font-black text-sm text-white truncate">{activeItem.label}</h1></div><div className="flex-1 flex justify-center"><div className="relative"><input className="pc-module-search" value={moduleSearch} onChange={e=>setModuleSearch(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')openSearchedModule()}} placeholder="⌕  Buscar módulo ou atleta..."/><span className="absolute right-3 top-1/2 -translate-y-1/2 text-[8px] text-slate-500">⌘ K</span></div></div></div>
                        <div className="md:hidden min-w-0"><div className="text-[8px] font-black text-sky-400 uppercase tracking-[.14em]">{activeGroup.label}</div><h1 className="font-black text-sm text-white truncate max-w-36">{activeItem.label}</h1></div>
                        <div className="flex gap-1.5 items-center shrink-0">
                            <div className="md:hidden"><TeamSwitcher compact registry={teamRegistry} activeTeamId={activeTeamId} onSwitch={switchTeam} onManage={openTeamManager}/></div>
                            <button onClick={()=>setTab('portal')} className="pc-portal-shortcut no-print"><Icon name="users" size={14}/> <span>PORTAL DO ATLETA</span></button>
                            <div className="hidden sm:block md:hidden"><NetworkStatus /></div>
                            <InstallAppButton />
                            <button onClick={() => setDarkMode(!darkMode)} className="p-2.5 rounded-xl hover:bg-white/5 text-slate-400 no-print transition-colors" title={darkMode ? "Modo claro" : "Modo escuro"}><Icon name={darkMode ? "sun" : "moon"}/></button>
                            <button onClick={printActiveView} className="hidden sm:block p-2.5 rounded-xl hover:bg-white/5 text-slate-400 no-print transition-colors" title="Exportar PDF da tela atual"><Icon name="printer"/></button>
                            <button onClick={()=>setShowSettings(true)} className="p-2.5 rounded-xl hover:bg-white/5 text-slate-400 no-print transition-colors" title="Configurações"><Icon name="settings"/></button>
                            {auth && <button onClick={()=>auth.signOut()} className="p-2.5 rounded-xl hover:bg-red-500/10 text-red-400 no-print transition-colors" title="Sair"><Icon name="logout"/></button>}
                        </div>
                    </header>
                    {activeGroup.items.length>1 && <div className="md:hidden flex bg-[#081425] border-b border-white/5 px-3 py-2 gap-2 overflow-x-auto no-print shrink-0">{activeGroup.items.map(item => <button key={item.tab} onClick={()=>setTab(item.tab)} className={`shrink-0 px-3 py-2 rounded-lg text-xs font-bold flex items-center gap-1.5 ${tab===item.tab?'text-white shadow':'bg-slate-100 text-slate-500'}`} style={{backgroundColor:tab===item.tab?themeColor:''}}><Icon name={item.icon} size={14}/>{item.label}</button>)}</div>}

                    <div className="app-content flex-1 overflow-hidden relative">
                {tab === 'clubhub' && <ClubHubView registry={teamRegistry} onSwitch={switchTeam} onCreate={()=>openTeamManager('create')} themeColor={themeColor} />}
                {tab === 'academyradar' && <AcademyRadarView registry={teamRegistry} onSwitch={switchTeam} movements={clubMovements} />}
                {tab === 'movements' && <MovementCenterView registry={teamRegistry} movements={clubMovements} onMove={executeMovement} onEnd={endMovement} />}
                {tab === 'clubcalendar' && <ClubCalendarView registry={teamRegistry} onSwitch={switchTeam} />}
                {tab === 'seasonshub' && <SeasonsHubView registry={teamRegistry} archives={seasonArchives} onNewSeason={startNewSeason} />}
                {tab === 'clubaccess' && <ClubAccessView registry={teamRegistry} access={clubAccess} setAccess={setClubAccess} />}
                {tab === 'dashboard' && <DashboardView themeColor={themeColor} players={playersRaw} matchHistory={matchHistoryRaw} history={sessionHistory} setTab={setTab} teamLogo={teamLogo} teamName={teamName} scoutingData={scoutingData} microData={microData} calendarData={calendarData} header={header} seasonStats={seasonStats} openStats={()=>setShowStatsModal(true)} notices={noticesRaw} setNotices={setNotices} />}
                {tab === 'squad' && <SquadView players={playersRaw} setPlayers={setPlayers} themeColor={themeColor} history={sessionHistory} />}
                {tab === 'lineup' && <ModernLineupView players={playersRaw} history={sessionHistory} themeColor={themeColor} />}
                {tab === 'decision' && <DecisionSupportView players={playersRaw} sessionHistory={sessionHistory} matchHistory={matchHistoryRaw} themeColor={themeColor} setTab={setTab} />}
                {tab === 'player360' && <Player360ProView players={playersRaw} setPlayers={setPlayers} sessionHistory={sessionHistory} matchHistory={matchHistoryRaw} themeColor={themeColor} />}
                {tab === 'development' && <AthleteDevelopmentView players={playersRaw} teamName={teamName} themeColor={themeColor} />}
                {tab === 'smartcenter' && <SmartPerformanceView players={playersRaw} sessionHistory={sessionHistory} matchHistory={matchHistoryRaw} teamName={teamName} themeColor={themeColor} setTab={setTab} />}
                {tab === 'performance' && <PerformanceView players={playersRaw} history={sessionHistory} themeColor={themeColor} />}
                {tab === 'gamecenter' && <GameCenterView themeColor={themeColor} teamName={teamName} teamLogo={teamLogo} players={playersRaw} scoutingData={scoutingData} setScoutingData={setScoutingData} scoutingHistory={scoutingHistoryRaw} setScoutingHistory={setScoutingHistory} matchData={matchData} setMatchData={setMatchData} matchHistory={matchHistoryRaw} setMatchHistory={setMatchHistory} sessionHistory={sessionHistory} setTab={setTab} />}
                {tab === 'scouting' && <ScoutingView themeColor={themeColor} scoutingData={scoutingData} setScoutingData={setScoutingData} scoutingHistory={scoutingHistoryRaw} setScoutingHistory={setScoutingHistory} />}
                {tab === 'opponenthistory' && <OpponentHistoryView scoutingData={scoutingData} setScoutingData={setScoutingData} scoutingHistory={scoutingHistoryRaw} matchHistory={matchHistoryRaw} sessionHistory={sessionHistory} teamName={teamName} />}
                {tab === 'session' && <ModernSessionView drills={sessionDrills} setDrills={setSessionDrills} header={header} setHeader={setHeader} logo={teamLogo} themeColor={themeColor} players={playersRaw} history={sessionHistory} setHistory={setSessionHistory} sessionDate={sessionDate} setSessionDate={setSessionDate} teamName={teamName} syncMicrocycle={(drills)=>syncSessionToMicrocycle(drills,sessionDate)} />}
                {tab === 'postmatch' && <ModernMatchReportView themeColor={themeColor} matchData={matchData} setMatchData={setMatchData} players={playersRaw} setPlayers={setPlayers} matchHistory={matchHistoryRaw} setMatchHistory={setMatchHistory} teamLogo={teamLogo} teamName={teamName} />}
                {tab === 'micro' && <MicrocycleView micro={microData} setMicro={setMicroData} themeColor={themeColor} calendar={calendarData} library={libraryDrillsRaw} currentSessionDate={sessionDate} teamName={teamName} teamLogo={teamLogo} onOpenSession={openSessionFromMicrocycle} onAddExercise={addExerciseToMicrocycle} onRemoveExercise={removeExerciseFromMicrocycle} onDateChange={connectMicrocycleDate} onLinkCurrentSession={(day)=>syncSessionToMicrocycle(sessionDrills,sessionDate,day)} sessionHistory={sessionHistory} />}
                {tab === 'board' && <VisualBoardView currentWeekStart={getMonday(boardWeekDate)} changeWeek={(d)=>{const n=new Date(boardWeekDate); n.setDate(n.getDate()+d); setBoardWeekDate(n);}} boardData={boardHistory[getWeekKey(boardWeekDate)]||{}} updateBoardData={(d,i)=>{const k=getWeekKey(boardWeekDate); setBoardHistory({...boardHistory, [k]:{...(boardHistory[k]||{}), [d]:i}});}} themeColor={themeColor} />}
                {tab === 'calendar' && <CalendarView calendar={calendarData} setCalendar={setCalendarData} themeColor={themeColor} notices={noticesRaw} />}
                {tab === 'library' && <SmartLibraryView lib={libraryDrillsRaw} setLib={setLibraryDrills} onAddS={(item)=>addExerciseToSession(item,sessionDate)} onSchedule={scheduleExercise} tC={themeColor} sessionHistory={sessionHistory} scoutingHistory={scoutingHistoryRaw} matchHistory={matchHistoryRaw} />}
                {tab === 'routines' && <RoutineSequencesView library={libraryDrillsRaw} players={playersRaw} teamName={teamName} themeColor={themeColor} onSchedule={scheduleExercise} />}
                {tab === 'tactical' && <TacticalBoardPro players={playersRaw} sessionHistory={sessionHistory} scoutingData={scoutingData} setScoutingData={setScoutingData} setTab={setTab} teamName={teamName} themeColor={themeColor} />}
                {tab === 'diary' && <CoachDiaryView teamName={teamName} sessionHistory={sessionHistory} matchHistory={matchHistoryRaw} scoutingData={scoutingData} />}
                {tab === 'mentor' && <MentorCoachView players={playersRaw} sessionHistory={sessionHistory} matchHistory={matchHistoryRaw} scoutingData={scoutingData} microData={microData} setMicroData={setMicroData} library={libraryDrillsRaw} themeColor={themeColor} />}
                {tab === 'reports' && <ProfessionalReportsView teamName={teamName} teamLogo={teamLogo} players={playersRaw} sessionHistory={sessionHistory} matchHistory={matchHistoryRaw} themeColor={themeColor} />}
                {['wellness','load','medical','contracts','season','communication','media','portal','roles','assistant','versions'].includes(tab) && <ClubModuleView mode={tab} players={playersRaw} sessionHistory={sessionHistory} teamName={teamName} teamId={activeTeamId} teamCategory={teamDisplayLabel(activeTeam)} themeColor={themeColor} />}
                {tab === 'printcenter' && <PrintCenterView teamName={teamName} teamLogo={teamLogo} sessionHistory={sessionHistory} matchHistory={matchHistoryRaw} />}
                    </div>
                </main>
            </div>
            <nav className="mobile-main-nav md:hidden fixed bottom-0 inset-x-0 bg-white border-t shadow-[0_-4px_18px_rgba(15,23,42,0.10)] z-40 flex justify-start overflow-x-auto px-1 pt-1 no-print">
                {navigationGroups.map(group => <button key={group.id} onClick={()=>openGroup(group)} className={`mobile-main-button shrink-0 w-20 rounded-xl flex flex-col items-center justify-center gap-1 text-[9px] font-bold ${activeGroup.id===group.id?'bg-slate-100':'text-slate-400'}`} style={{color:activeGroup.id===group.id?themeColor:''}}><Icon name={group.icon} size={19}/><span className="truncate max-w-[74px]">{group.label}</span></button>)}
            </nav>
        </div>
    );
};

const MainControl = () => {
    const [user, setUser] = useState(null); const [loading, setLoading] = useState(true);
    useEffect(() => {
        const setLoadingProgress=(text,percent)=>{const label=document.getElementById('loading-text'),bar=document.getElementById('loading-progress-bar'),value=document.getElementById('loading-percent');if(label)label.innerText=text;if(bar)bar.style.width=`${percent}%`;if(value)value.innerText=`${percent}%`;};
        const finishLoading=()=>{clearTimeout(window.__pcBootGuard);setLoadingProgress('Painel pronto',100);setTimeout(()=>{setLoading(false);const l=document.getElementById('loading');if(l){l.style.opacity='0';l.style.transition='opacity .25s ease';setTimeout(()=>l.style.display='none',260);}},220);};
        setLoadingProgress('Validando acesso',28);
        if (!auth) { setLoadingProgress('Abrindo dados locais',86); finishLoading(); return; }
        const t = setTimeout(() => { setLoadingProgress('Abrindo no modo local',92); finishLoading(); }, 8000);
        const un = auth.onAuthStateChanged(async (u) => {
            clearTimeout(t);
            if (u && db) {
                try {
                    setLoadingProgress('Sincronizando dados da equipe',58);
                    const doc = await db.collection('coachData').doc(u.uid).get({ source: 'default' });
                    if (doc.exists) {
                        const d = doc.data(); Object.keys(d).forEach(k => { if (k.startsWith('pc_')) { window.localStorage.setItem(k, typeof d[k] === 'string' ? d[k] : JSON.stringify(d[k])); } });
                    }
                    setLoadingProgress('Preparando indicadores',86);
                } catch(e) { setLoadingProgress('Usando dados disponíveis no aparelho',86); }
            }
            setUser(u); finishLoading();
        });
        return () => {clearTimeout(t);un();};
    }, []);

    if (loading) return null;
    if (!user && auth) return <AuthScreen />;
    return <App user={user} />;
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<ErrorBoundary><MainControl /></ErrorBoundary>);
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
</script>
</body>

</html>
