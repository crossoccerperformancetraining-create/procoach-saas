<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020617">
<title>ProCoach Atleta</title>
<style>
html,body{height:100%;margin:0;background:#020617;color:#fff;font-family:Inter,system-ui,-apple-system,sans-serif}main{height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box}.card{max-width:390px}.icon{font-size:56px}.title{font-size:24px;font-weight:900;text-transform:uppercase;margin:18px 0 10px}.text{color:#94a3b8;font-size:14px;line-height:1.55;font-weight:700}.btn{display:inline-block;margin-top:24px;border:0;border-radius:14px;background:#2563eb;color:#fff;padding:15px 24px;font-weight:900;text-transform:uppercase;font-size:12px}.muted{margin-top:14px;color:#475569;font-size:10px;text-transform:uppercase;letter-spacing:.08em}
</style>
</head>
<body><main><div class="card"><div class="icon" id="icon">⏳</div><div class="title" id="title">Abrindo ProCoach</div><div class="text" id="text">Recuperando seu último acesso individual…</div><button class="btn" id="retry" hidden>Atualizar</button><div class="muted">Portal da atleta • v2.0.3</div></div></main>
<script>
(function(){
 const KEY='procoach_athlete_last_access_v1';
 const retry=document.getElementById('retry');
 const open=()=>{
   let saved=null; try{saved=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
   if(saved&&saved.id&&(saved.uid||saved.p)){
      const q=new URLSearchParams({id:saved.id,v:'203'});
      if(saved.uid)q.set('uid',saved.uid);else q.set('p',saved.p);
      if(saved.mode)q.set('mode',saved.mode);if(saved.secure)q.set('secure',saved.secure);
      location.replace('/atleta.html?'+q.toString()); return;
   }
   document.getElementById('icon').textContent=navigator.onLine?'⚠️':'📶';
   document.getElementById('title').textContent=navigator.onLine?'Acesso não identificado':'Sem conexão';
   document.getElementById('text').textContent=navigator.onLine?'Abra uma vez o link individual enviado pela comissão. Depois disso, o ícone abrirá seu perfil automaticamente.':'Conecte-se à internet e toque em Atualizar. Se este aparelho já acessou o perfil antes, ele será restaurado automaticamente.';
   retry.hidden=false;
 };
 retry.onclick=()=>location.reload(); window.addEventListener('online',open); open();
})();
</script></body></html>
